name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: registry.zhangjie.life
  IMAGE_NAME: feishu/start
  K8S_NAMESPACE: default
  DEPLOYMENT: feishu-start
  CONTAINER: feishu-start

jobs:
  deploy:
    runs-on: [self-hosted, linux, amd64, overseas]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to private registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ env.REGISTRY }}" \
            -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker build --platform linux/amd64 \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Apply manifests and rollout
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          kubectl apply -f deploy/k8s.yaml
          kubectl set image "deployment/${DEPLOYMENT}" "${CONTAINER}=${IMAGE}" -n "${K8S_NAMESPACE}"
          kubectl rollout status "deployment/${DEPLOYMENT}" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Summary
        run: |
          echo "Deployed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "URL: https://zhangjie.life/feishu-app/"
